name: Deploy manually to VPS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run deployment on approved VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_PATH: ${{ secrets.VPS_APP_PATH }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PATH"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Preload SSH host key on the runner only after verifying it out of band.
          # Deployment fails closed if VPS_SSH_KNOWN_HOSTS is missing.
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$SSH_PATH' && bash ./deploy/backup.sh && git pull --ff-only && docker compose up -d --build && docker compose ps"
