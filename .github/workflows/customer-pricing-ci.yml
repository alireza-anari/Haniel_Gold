name: HANI-EL customer pricing and manager checks
on:
  pull_request:
    paths:
      - 'customer-pricing/**'
      - 'telegram-miniapp/**'
      - '.github/workflows/customer-pricing-ci.yml'
  push:
    branches:
      - feat/telegram-customer-price-miniapp
    paths:
      - 'customer-pricing/**'
      - 'telegram-miniapp/**'
      - '.github/workflows/customer-pricing-ci.yml'
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm run check
      - run: npm test
  customer-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: customer-pricing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm run check
      - run: npm test
