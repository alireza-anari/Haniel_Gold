name: Prepare Telegram Mini App source
on:
  push:
    branches:
      - feature/telegram-miniapp-cloudflare
    paths:
      - telegram-miniapp/_sources/part-05.txt
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-miniapp-cloudflare
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore app source from verified archive
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const paths=fs.readdirSync('telegram-miniapp/_sources').filter(n=>n.startsWith('part-') && n.endsWith('.txt') && n.length===11).sort();
          if(paths.length!==6) throw new Error('Expected six source payload parts');
          const input=paths.map(n=>fs.readFileSync('telegram-miniapp/_sources/'+n,'utf8').trim()).join('');
          fs.writeFileSync('/tmp/telegram-miniapp-source.tar',zlib.brotliDecompressSync(Buffer.from(input,'base64')));
          NODE
          tar -tf /tmp/telegram-miniapp-source.tar
          tar -xf /tmp/telegram-miniapp-source.tar -C telegram-miniapp
          mkdir -p telegram-miniapp/public/assets telegram-miniapp/public/vendor
          cp frontend/assets/brand-gold.png telegram-miniapp/public/assets/logo.png
          cp frontend/assets/clover-gold.png telegram-miniapp/public/assets/clover.png
          mkdir -p /tmp/haniel-jszip
          cd /tmp/haniel-jszip
          npm pack jszip@3.10.1 --silent
          tar -xzf jszip-3.10.1.tgz
          cp package/dist/jszip.min.js "$GITHUB_WORKSPACE/telegram-miniapp/public/vendor/jszip.min.js"
          cp package/LICENSE.markdown "$GITHUB_WORKSPACE/telegram-miniapp/public/vendor/jszip.LICENSE.md"
          cd "$GITHUB_WORKSPACE"
          rm -rf telegram-miniapp/_sources
      - name: Verify app syntax and finance/auth tests
        working-directory: telegram-miniapp
        run: |
          npm test
          npm run check
      - name: Commit readable isolated mini-app files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A telegram-miniapp
          if ! git diff --cached --quiet; then
            git commit -m "feat(miniapp): unpack Cloudflare Telegram management app"
            git push origin HEAD:feature/telegram-miniapp-cloudflare
          fi
