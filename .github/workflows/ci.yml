name: HANI-EL CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend JavaScript
        run: node --check frontend/app.js
      - name: Project structure and safety preflight
        run: python3 tools/preflight.py
      - name: Public repository staged-file safety
        run: python3 tools/scan_git_public.py --filesystem
      - name: Ensure no committed environment secrets
        run: |
          test ! -f .env
          test ! -f backend/.env
  backend:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: haniel_test
          POSTGRES_USER: haniel_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haniel_test -d haniel_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_DEBUG: '0'
      DJANGO_SECRET_KEY: 'ci_very_long_secret_that_will_not_be_used_in_any_production_environment_2026'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
      POSTGRES_DB: haniel_test
      POSTGRES_USER: haniel_test
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      SMS_BACKEND: disabled
      SERVIX_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run automated tests
        run: python manage.py test tests --verbosity 2
      - name: Production security checks
        run: python manage.py check --deploy
