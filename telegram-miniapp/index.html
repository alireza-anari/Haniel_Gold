<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="منوی اصلی">
      <div class="brand"><img src="/assets/logo.png" alt="لوگوی رسمی HANI-EL GOLD"><span>PRIVATE WORKSPACE</span></div>

      <div class="side-bottom"><span id="user-role">—</span><small>HANI-EL GOLD ©</small></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-identity">
          <img class="topbar-clover" src="/assets/clover.png" alt="" aria-hidden="true">
          <div class="topbar-heading">
            <span class="eyebrow">HANI-EL GOLD <span class="eyebrow-sep">/</span> PRIVATE OFFICE</span>
            <h1 id="page-title">داشبورد</h1>
          </div>
        </div>
        <div class="topbar-tools">
          <button class="icon-button back-button" id="back" type="button" aria-label="بازگشت به صفحه قبل" title="بازگشت" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>

          </button>
        </div>
      </header>
      <div id="notice" class="notice" aria-live="polite"></div>
      <section id="view" class="view" aria-live="polite"><div class="loading"><span class="loader"></span> در حال بارگیری اطلاعات…</div></section>
    </main>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="منوی پایین"></nav>
  <dialog id="modal"><div class="dialog-head"><h2 id="modal-title">فرم</h2><button class="icon-button" id="close-modal" type="button" aria-label="بستن">×</button></div><div id="modal-body"></div></dialog>
