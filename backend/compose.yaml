services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haniel}
      POSTGRES_USER: ${POSTGRES_USER:-haniel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 15
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "30"]
  rate-worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "manage.py", "run_rate_scheduler"]
volumes:
  postgres_data:
